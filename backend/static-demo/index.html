<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TaskFlow</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #171a23;
    --border: #262a36;
    --text: #e6e8ef;
    --muted: #8b90a0;
    --accent: #6c8cff;
    --danger: #ff6b6b;
    --ok: #4fd67e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 24px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input, textarea {
    flex: 1;
    min-width: 120px;
    background: #0f1117;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  button.secondary { background: #2a2f3d; }
  button.danger { background: var(--danger); }
  button:hover { filter: brightness(1.1); }
  .taskrow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .taskrow:last-child { border-bottom: none; }
  .taskrow .title { font-weight: 600; }
  .taskrow .desc { color: var(--muted); font-size: 13px; }
  .taskrow.done .title { text-decoration: line-through; color: var(--muted); }
  .grow { flex: 1; }
  .msg { font-size: 13px; margin-top: 8px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .hidden { display: none; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { background: #2a2f3d; }
  .tabs button.active { background: var(--accent); }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .field { margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TaskFlow</h1>
  <div class="sub">Talks to the FastAPI backend at <code id="apiBaseLabel"></code></div>

  <div class="card">
    <label>API base URL</label>
    <div class="row">
      <input id="apiBase" value="http://localhost:8000" />
    </div>
  </div>

  <div id="authSection" class="card">
    <div class="tabs">
      <button id="tabLogin" class="active">Log in</button>
      <button id="tabRegister">Register</button>
    </div>

    <div id="loginForm">
      <div class="field"><label>Username</label><input id="loginUsername" /></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" /></div>
      <button id="loginBtn">Log in</button>
    </div>

    <div id="registerForm" class="hidden">
      <div class="field"><label>Name</label><input id="regName" /></div>
      <div class="field"><label>Username</label><input id="regUsername" /></div>
      <div class="field"><label>Email</label><input id="regEmail" /></div>
      <div class="field"><label>Password (min 8 chars)</label><input id="regPassword" type="password" /></div>
      <button id="registerBtn">Create account</button>
    </div>

    <div id="authMsg" class="msg"></div>
  </div>

  <div id="taskSection" class="card hidden">
    <div class="row" style="margin-bottom:12px; align-items:center;">
      <div class="grow">Signed in as <b id="whoami"></b></div>
      <button class="secondary" id="logoutBtn">Log out</button>
    </div>

    <div class="row" style="margin-bottom:14px;">
      <input id="newTitle" placeholder="Task title" />
      <input id="newDesc" placeholder="Description" />
      <button id="addBtn">Add</button>
    </div>

    <div id="taskList"></div>
    <div id="taskMsg" class="msg"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("taskflow_token") || null;

function apiBase() { return $("apiBase").value.replace(/\/$/, ""); }
$("apiBaseLabel").textContent = apiBase();
$("apiBase").addEventListener("input", () => $("apiBaseLabel").textContent = apiBase());

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (token) headers["Authorization"] = `Bearer ${token}`;
  const res = await fetch(apiBase() + path, { ...opts, headers });
  let data = null;
  try { data = await res.json(); } catch (_) { /* e.g. 204 No Content */ }
  if (!res.ok) throw new Error((data && data.detail) || `Request failed (${res.status})`);
  return data;
}

function showMsg(el, text, ok = false) {
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "error");
}

$("tabLogin").onclick = () => {
  $("tabLogin").classList.add("active");
  $("tabRegister").classList.remove("active");
  $("loginForm").classList.remove("hidden");
  $("registerForm").classList.add("hidden");
};
$("tabRegister").onclick = () => {
  $("tabRegister").classList.add("active");
  $("tabLogin").classList.remove("active");
  $("registerForm").classList.remove("hidden");
  $("loginForm").classList.add("hidden");
};

$("registerBtn").onclick = async () => {
  try {
    await api("/user/register", {
      method: "POST",
      body: JSON.stringify({
        name: $("regName").value,
        username: $("regUsername").value,
        email: $("regEmail").value,
        password: $("regPassword").value,
      }),
    });
    showMsg($("authMsg"), "Account created — now log in.", true);
    $("tabLogin").click();
    $("loginUsername").value = $("regUsername").value;
  } catch (e) { showMsg($("authMsg"), e.message); }
};

$("loginBtn").onclick = async () => {
  try {
    const data = await api("/user/login", {
      method: "POST",
      body: JSON.stringify({
        username: $("loginUsername").value,
        password: $("loginPassword").value,
      }),
    });
    token = data.token;
    localStorage.setItem("taskflow_token", token);
    await enterApp();
  } catch (e) { showMsg($("authMsg"), e.message); }
};

$("logoutBtn").onclick = () => {
  token = null;
  localStorage.removeItem("taskflow_token");
  $("authSection").classList.remove("hidden");
  $("taskSection").classList.add("hidden");
};

async function enterApp() {
  const me = await api("/user/me");
  $("whoami").textContent = me.username;
  $("authSection").classList.add("hidden");
  $("taskSection").classList.remove("hidden");
  await refreshTasks();
}

async function refreshTasks() {
  const data = await api("/tasks/all_task");
  const list = $("taskList");
  list.innerHTML = "";
  if (data.tasks.length === 0) {
    list.innerHTML = '<div class="sub">No tasks yet — add one above.</div>';
    return;
  }
  for (const t of data.tasks) {
    const row = document.createElement("div");
    row.className = "taskrow" + (t.is_completed ? " done" : "");
    row.innerHTML = `
      <input type="checkbox" ${t.is_completed ? "checked" : ""} data-id="${t.id}" class="toggle" />
      <div class="grow">
        <div class="title">${t.title}</div>
        <div class="desc">${t.description || ""}</div>
      </div>
      <button class="danger del" data-id="${t.id}">Delete</button>
    `;
    list.appendChild(row);
  }
  list.querySelectorAll(".toggle").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const id = cb.dataset.id;
      const task = data.tasks.find((t) => String(t.id) === id);
      try {
        await api(`/tasks/update/${id}`, {
          method: "PUT",
          body: JSON.stringify({ title: task.title, description: task.description, is_completed: cb.checked }),
        });
        await refreshTasks();
      } catch (e) { showMsg($("taskMsg"), e.message); }
    });
  });
  list.querySelectorAll(".del").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await api(`/tasks/delete/${btn.dataset.id}`, { method: "DELETE" });
        await refreshTasks();
      } catch (e) { showMsg($("taskMsg"), e.message); }
    });
  });
}

$("addBtn").onclick = async () => {
  const title = $("newTitle").value.trim();
  if (!title) return;
  try {
    await api("/tasks/create", {
      method: "POST",
      body: JSON.stringify({ title, description: $("newDesc").value, is_completed: false }),
    });
    $("newTitle").value = "";
    $("newDesc").value = "";
    await refreshTasks();
  } catch (e) { showMsg($("taskMsg"), e.message); }
};

if (token) { enterApp().catch(() => { token = null; localStorage.removeItem("taskflow_token"); }); }
</script>
</body>
</html>
