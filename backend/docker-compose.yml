services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow_db
    ports:
      - "5432:5432"
    volumes:
      - taskflow_pg_data:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_CONNECTION: postgresql://postgres:postgres@db:5432/taskflow_db
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      ALGORITHM: HS256
      EXP_TIME: "30"
      ALLOWED_ORIGINS: "*"
    ports:
      - "8000:8000"

volumes:
  taskflow_pg_data:
